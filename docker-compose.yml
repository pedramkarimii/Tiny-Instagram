services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  application:
    env_file:
      - ./.env
    build:
      context: .
      dockerfile: utility/Dockerfile
    image: tiny-instagram-app:local
    restart: unless-stopped
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8000
      - config.wsgi:application
      - --log-level
      - ${API_LOG_LEVEL:-info}
      - --workers
      - ${API_WORKERS:-2}
      - --threads
      - ${API_THREADS:-2}
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    expose:
      - "8000"
    volumes:
      - static_data:/app/storage/static_collected
      - media_data:/app/storage/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    build:
      context: .
      dockerfile: utility/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_HOST_PORT:-8081}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_HOST_PORT:-8444}:443"
    volumes:
      - static_data:/shared/static_collected:ro
      - media_data:/shared/media:ro
      - certbot_www:/vol/www
      - certbot_certs:/etc/letsencrypt
    depends_on:
      application:
        condition: service_healthy

  certbot:
    profiles: ["certbot"]
    build:
      context: .
      dockerfile: utility/certbot/Dockerfile
    command: echo "Certbot profile enabled"
    volumes:
      - certbot_www:/vol/www
      - certbot_certs:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started

volumes:
  media_data:
  static_data:
  certbot_certs:
  certbot_www:
  postgres_data:
  redis_data:
